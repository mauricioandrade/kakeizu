# Postgres for running outside Quarkus dev mode (dev/test use Dev Services).
# Put the two passwords in .env (gitignored): POSTGRES_PASSWORD (superuser, admin only) and DB_PASSWORD (the app).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kakeizu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_USER: ${DB_USER:-kakeizu}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # same machine only: the app is the only client
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned subdirectory (18/docker) and refuses the old /data mount
      - kakeizu-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

volumes:
  kakeizu-data:
