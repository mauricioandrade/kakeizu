<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#17181b">
    {! htmx: no eval, no injected styles (strict CSP), and swap error pages too !}
    <meta name="htmx-config" content='{|{"allowEval":false,"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}|}'>
    <title>{#insert title}Kakeizu{/insert}</title>
    <link rel="preload" href="/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/atkinson-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/htmx-2.0.11.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" defer></script>
</head>
<body class="page-{#insert page}other{/insert}">
{#insert nav}
<header class="shell">
    <a class="wordmark" href="/" aria-label="Kakeizu, today's receipts">
        <span class="wordmark-name">Kakeizu</span>
        <span class="wordmark-kanji" lang="ja" aria-hidden="true">家計簿</span>
    </a>
    <nav class="tabs" aria-label="Main">
        <a href="/" class="tab"{#insert currentToday}{/insert}>Today</a>
        <a href="/summary" class="tab"{#insert currentSummary}{/insert}>Summary</a>
        <a href="/report" class="tab"{#insert currentReport}{/insert}>Sales</a>
    </nav>
</header>
{/insert}
<main>
{#insert /}
</main>
</body>
</html>
