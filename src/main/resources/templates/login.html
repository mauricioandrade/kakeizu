{#include base}
{#title}Kakeizu · Sign in{/title}
{#page}login{/page}
{#nav}{/nav}
<div class="login-mark">
    <span class="wordmark-name">Kakeizu</span>
    <p>Receipts read on this machine. Nothing leaves it.</p>
</div>
<section class="slip" aria-labelledby="login-title">
    <div class="slip-head">
        <h1 class="slip-title" id="login-title">Sign in</h1>
        <span class="slip-meta">admin</span>
    </div>
    {#if error}
    <p class="notice notice-error" role="alert"><strong>Wrong password, or too many attempts.</strong>Try again in a minute.</p>
    {/if}
    <form method="post" action="/j_security_check">
        <input type="hidden" name="j_username" value="admin">
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="j_password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit" class="btn-wide">Sign in</button>
    </form>
</section>
{/include}
