quarkus.application.name=kakeizu

# --- AI (Ollama + Gemma) ---
kakeizu.model=${KAKEIZU_MODEL:gemma4:e4b}
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${kakeizu.model}
quarkus.langchain4j.ollama.chat-model.temperature=0
# First local inference is slow
quarkus.langchain4j.ollama.timeout=60s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=true
# We always talk to our own Ollama (WSL or Windows); never start a container or pull models silently
quarkus.langchain4j.ollama.devservices.enabled=false

# --- Database ---
quarkus.datasource.db-kind=postgresql
# Same image as docker-compose.yml
quarkus.datasource.devservices.image-name=postgres:16-alpine
# Dev Services start a container in dev/test; prod points to docker-compose
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/kakeizu}
%prod.quarkus.datasource.username=${DB_USER:kakeizu}
%prod.quarkus.datasource.password=${DB_PASSWORD:kakeizu}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# --- Storage ---
kakeizu.storage.dir=${KAKEIZU_STORAGE_DIR:data/images}

# --- Local overrides (gitignored) ---
quarkus.config.locations=application-local.properties
