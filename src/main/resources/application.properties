quarkus.application.name=kakeizu

# --- AI (Ollama + Gemma) ---
kakeizu.model=${KAKEIZU_MODEL:gemma4:e4b}
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${kakeizu.model}
quarkus.langchain4j.ollama.chat-model.temperature=0
# Gemma 4 thinks before answering: 5-10x slower, but without it the model picked an item price as the total
# and the card brand as the store, errors no check digit can catch. The reasoning itself is never kept.
quarkus.langchain4j.ollama.chat-model.model-options.think=true
quarkus.langchain4j.ollama.chat-model.model-options.return-thinking=false
# First local inference is slow
quarkus.langchain4j.ollama.timeout=60s
# Load the model on startup and when the upload page opens, so the reading itself starts warm
kakeizu.ai.warm-up=true
%test.kakeizu.ai.warm-up=false
# One GPU: extra uploads wait in line instead of piling up on Ollama
kakeizu.ai.max-concurrent-readings=${KAKEIZU_MAX_CONCURRENT_READINGS:1}
quarkus.langchain4j.ollama.log-requests=false
# Model output contains financial data: only log it in dev
%dev.quarkus.langchain4j.ollama.log-responses=true
# We always talk to our own Ollama (WSL or Windows); never start a container or pull models silently
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

# --- Database ---
quarkus.datasource.db-kind=postgresql
# Same image as docker-compose.yml
quarkus.datasource.devservices.image-name=postgres:16-alpine
# Dev Services start a container in dev/test; prod points to docker-compose
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/kakeizu}
%prod.quarkus.datasource.username=${DB_USER:kakeizu}
# No default: prod fails to start without it
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
# Flyway owns the schema; Hibernate only checks that entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Storage ---
kakeizu.storage.dir=${KAKEIZU_STORAGE_DIR:data/images}
%test.kakeizu.storage.dir=target/test-images

kakeizu.zone=${KAKEIZU_ZONE:America/Sao_Paulo}

# The shop's own CNPJ: when the shop is the one who received the money, the receipt is a sale; any other
# CNPJ means an expense. Without it (or with a CPF on the receipt) a person chooses on review.
kakeizu.shop.cnpj=${KAKEIZU_SHOP_CNPJ:}
# Off by default: a cheque, or a receipt paid by cheque, is flagged on review instead of accepted
kakeizu.shop.accepts-cheques=${KAKEIZU_SHOP_ACCEPTS_CHEQUES:false}

# --- Login: single "admin" user, everything else requires it ---
# Generate with: java src/main/java/dev/mauricioandrade/kakeizu/infrastructure/security/PasswordHasher.java
kakeizu.admin.password-hash=${KAKEIZU_ADMIN_PASSWORD_HASH}
# Dev/test password: kakeizu
%dev,test.kakeizu.admin.password-hash=pbkdf2-sha256:600000:zEWL24zRy3J8D/1XdDCFbw==:cyR2atKMWaNlJ2v1AwsG8v4e1ds69V+zSqQlsPYrNDo=
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login-error
quarkus.http.auth.form.landing-page=/
# Session ends after 30 minutes without activity
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
# Encrypts the session cookie; without it, sessions are lost on every restart
quarkus.http.auth.session.encryption-key=${KAKEIZU_SESSION_KEY}
%dev,test.quarkus.http.auth.session.encryption-key=dev-only-session-key-not-secret
# The login page needs its stylesheet, script and fonts before there is a session
quarkus.http.auth.permission.public.paths=/login,/login-error,/css/*,/js/*,/fonts/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.app.paths=/*
quarkus.http.auth.permission.app.policy=authenticated

# --- Web ---
# A phone photo is 2-5 MB, and a batch has up to 5 of them; each photo is also capped at 10 MB on upload
quarkus.http.limits.max-body-size=30M
# Everything (htmx included) is served by the app itself: no inline scripts or styles, no third parties
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

# --- HTTPS ---
# Dev mode only listens on localhost, so plain HTTP is fine there. In prod the app is reachable from the
# shop Wi-Fi, so it only speaks HTTPS: the password and the session cookie (marked Secure) never travel
# in clear text. No default certificate: prod fails to start without one. See README.
%prod.quarkus.tls.key-store.pem.0.cert=${KAKEIZU_TLS_CERT}
%prod.quarkus.tls.key-store.pem.0.key=${KAKEIZU_TLS_KEY}
%prod.quarkus.http.insecure-requests=disabled

# --- Local overrides (gitignored) ---
quarkus.config.locations=application-local.properties

# --- Health (database and Ollama) ---
# On the management interface, port 9000, bound to this machine only: a local monitor can poll
# /q/health without a login, and the shop Wi-Fi cannot reach it
quarkus.management.enabled=true
quarkus.management.host=localhost
